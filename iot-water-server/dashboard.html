<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบควบคุมปั๊มน้ำอัจฉริยะ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-green-50 min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-bold text-gray-800">ระบบควบคุมปั๊มน้ำอัจฉริยะ</h1>
        <p class="text-gray-600">IoT Water Management System • ESP8266 + 5 Soil Sensors</p>
      </div>
      <div id="timestamp" class="text-sm text-gray-500"></div>
    </div>

    <!-- Status Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <!-- Pump Status -->
      <div class="bg-white rounded-3xl shadow-lg p-6">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-gray-500 text-sm">สถานะปั๊มน้ำ</p>
            <p id="pump-status" class="text-4xl font-bold mt-2 text-green-600">ปิดอยู่</p>
          </div>
          <i class="fas fa-water text-5xl text-blue-500"></i>
        </div>
      </div>

      <!-- Mode -->
      <div class="bg-white rounded-3xl shadow-lg p-6">
        <p class="text-gray-500 text-sm">โหมดการทำงาน</p>
        <p id="mode-status" class="text-3xl font-semibold mt-3 text-indigo-600">อัตโนมัติ</p>
      </div>

      <!-- MQTT Connection -->
      <div class="bg-white rounded-3xl shadow-lg p-6">
        <p class="text-gray-500 text-sm">สถานะ MQTT</p>
        <p id="mqtt-status" class="text-3xl font-semibold mt-3 text-gray-600">กำลังตรวจสอบ...</p>
      </div>

      <!-- Avg Soil -->
      <div class="bg-white rounded-3xl shadow-lg p-6">
        <p class="text-gray-500 text-sm">ความชื้นดินเฉลี่ย</p>
        <p id="avg-soil" class="text-4xl font-bold mt-2 text-amber-600">---</p>
      </div>
    </div>

    <!-- Soil Moisture Cards (5 Zones) -->
    <div class="mb-8">
      <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
        <i class="fas fa-seedling"></i> ความชื้นดิน 5 โซน
      </h2>
      <div id="soil-grid" class="grid grid-cols-2 md:grid-cols-5 gap-4">
        <!-- 5 Cards จะถูกสร้างด้วย JS -->
      </div>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-3xl shadow-lg p-6">
        <h3 class="font-semibold mb-4">อุณหภูมิและความชื้นอากาศ</h3>
        <canvas id="tempChart" height="120"></canvas>
      </div>
      <div class="bg-white rounded-3xl shadow-lg p-6">
        <h3 class="font-semibold mb-4">การทำงานของปั๊ม (ล่าสุด)</h3>
        <canvas id="pumpChart" height="120"></canvas>
      </div>
    </div>

    <!-- Control Buttons -->
    <div class="mt-10 flex flex-wrap gap-4 justify-center">
      <button onclick="controlPump('on')" 
              class="bg-green-600 hover:bg-green-700 text-white px-10 py-5 rounded-2xl text-lg font-medium flex items-center gap-3">
        <i class="fas fa-play"></i> เปิดปั๊ม
      </button>
      <button onclick="controlPump('off')" 
              class="bg-red-600 hover:bg-red-700 text-white px-10 py-5 rounded-2xl text-lg font-medium flex items-center gap-3">
        <i class="fas fa-stop"></i> ปิดปั๊ม
      </button>
      <button onclick="setMode('auto')" 
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-5 rounded-2xl text-lg font-medium">
        โหมดอัตโนมัติ
      </button>
      <button onclick="setMode('manual')" 
              class="bg-gray-600 hover:bg-gray-700 text-white px-8 py-5 rounded-2xl text-lg font-medium">
        โหมดมือ
      </button>
    </div>
  </div>

  <script>
    let tempChart, pumpChart;

    async function updateDashboard() {
      const res = await fetch('/api/status');
      const data = await res.json();

      // Update Pump Status
      const isPumpOn = String(data.pump_state).toUpperCase() === 'ON' || data.pump_state === true;
      document.getElementById('pump-status').textContent = isPumpOn ? 'เปิดอยู่' : 'ปิดอยู่';
      document.getElementById('pump-status').className = isPumpOn ? 
        'text-4xl font-bold mt-2 text-green-600' : 'text-4xl font-bold mt-2 text-red-600';

      const isAutoMode = String(data.auto_mode).toUpperCase() === 'AUTO' || data.auto_mode === true;
      document.getElementById('mode-status').textContent = isAutoMode ? 'อัตโนมัติ' : 'มือ';
      document.getElementById('timestamp').textContent = data.timestamp || 'กำลังอัพเดท...';

      const mqttStatus = document.getElementById('mqtt-status');
      if (data.mqtt_connected) {
        mqttStatus.textContent = 'เชื่อมต่อแล้ว';
        mqttStatus.className = 'text-3xl font-semibold mt-3 text-emerald-600';
      } else {
        mqttStatus.textContent = 'ไม่เชื่อมต่อ';
        mqttStatus.className = 'text-3xl font-semibold mt-3 text-red-600';
      }

      // Soil Moisture Grid
      const grid = document.getElementById('soil-grid');
      grid.innerHTML = '';
      data.soil_moisture.forEach((value, i) => {
        const status = value > 580 ? 'แห้ง' : 'ชื้น';
        const color = value > 580 ? 'text-amber-600' : 'text-emerald-600';
        grid.innerHTML += `
          <div class="bg-white rounded-2xl shadow p-4 text-center">
            <p class="text-sm text-gray-500">โซน ${i+1}</p>
            <p class="text-3xl font-bold ${color}">${value}</p>
            <p class="text-xs ${color}">${status}</p>
          </div>`;
      });

      // Average Soil
      const avg = data.soil_moisture.reduce((a,b)=>a+b,0) / data.soil_moisture.length;
      document.getElementById('avg-soil').textContent = avg.toFixed(0);
    }

    function controlPump(action) {
      fetch(`/api/pump/${action}`, { method: 'POST' });
    }

    function setMode(mode) {
      fetch(`/api/mode/${mode}`, { method: 'POST' });
    }

    // Initial Load + Refresh
    setInterval(updateDashboard, 3000);
    updateDashboard();
  </script>
</body>
</html>
